# /admin/config.yml (alternatif: dosyadan yüklemek istersen)
backend:
name: github
repo: Mirmurat/clinxcode-site
branch: main
base_url: https://clinxcode.com
auth_endpoint: /oauth

media_folder: static/uploads
public_folder: /uploads

collections:
- name: hero
label: Hero
format: json
files:
- name: hero
label: Hero
file: content/hero.json
fields:
- {name: headline, label: Headline, widget: string}
- {name: subline, label: Subline, widget: text}
